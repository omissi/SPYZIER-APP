name: Build Parent and Child APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: parent
            repository: omissi/SPYZIER-APP
            branch: master
          - app: child
            repository: ranaaditya/Child-SPYZIER-APP
            branch: master

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.branch }}
          submodules: false

      - name: Set up Java for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Fix legacy dependency repositories
        shell: bash
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

          cat >> build.gradle <<'EOF'

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url 'https://repo.gradle.org/gradle/libs-releases/'
                  }
              }

              configurations.all {
                  resolutionStrategy.force 'com.android.volley:volley:1.2.1'
              }
          }
          EOF
      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
